version: "3.8"

services:
  app:
    image: ksan319/blood_spot:latest
    container_name: "blood_spot_api"
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./src/main/resources/application.yml:/app/application.yml
    depends_on:
      - db
    restart: "always"

  db:
    image: postgres:15
    restart: "always"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
